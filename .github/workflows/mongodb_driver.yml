name: Elixir CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Compile and Test
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        mongodb-version: ["5.0", "6.0", "7.0", "8.0"]

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2

      - name: Start MongoDB
        run: |
          uname -r
          docker run --name mongodb --publish 27017:27017 --detach mongo:${{ matrix.mongodb-version }} --replSet rs_1
          for attempt in $(seq 60); do docker exec mongodb mongosh --quiet --eval "db.hello().ok" && break; sleep 1; done
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({_id: "rs_1", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in $(seq 60); do docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && exit 0; sleep 1; done
          exit 1

      - name: Show MongoDB's log
        if: failure()
        run: docker logs mongodb

      - name: Read .tool-versions
        uses: marocchino/tool-versions-action@v1
        id: versions

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{steps.versions.outputs.elixir}}
          otp-version: ${{ steps.versions.outputs.erlang}}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-v1-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-v1-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test --exclude ssl --exclude socket --exclude rs_required

      - name: Run Credo
        run: mix credo

      - name: Check Formatting
        run: mix format --check-formatted
        if: always()
